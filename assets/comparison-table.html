<!-- Forge comparison table. Paste into the Webflow rich-text block, then confirm this CSS
     survived the paste. Rules: rules/writing.md section 14. -->
<style>
  :root {
    --primary-color: #6E40D7;
    --primary-dark: #5B35C9;
    --text-color: #1F2430;
    --border-color: #E6E1F2;
    --row-alt: #FAF8FF;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: Inter, Arial, sans-serif; background: #FFFFFF; color: var(--text-color); }
  .table-container {
    width: 100%; background: #fff; border-radius: var(--radius);
    overflow-x: auto; border: 1px solid var(--border-color);
    box-shadow: none; margin: 0; padding: 0; font-size: 0; line-height: 0;
  }
  .table-container table {
    width: 100%; min-width: 900px;
    border-collapse: collapse; border-spacing: 0; table-layout: auto;
    margin: 0; padding: 0; font-size: 14px; line-height: 1.75; background: #fff;
  }
  .table-container thead, .table-container tbody, .table-container tr { margin: 0; padding: 0; border: 0; }
  .table-container thead { background: #F7F7FB; }
  .table-container thead th {
    background: #F7F7FB; color: #222; font-size: 14px; font-weight: 700;
    padding: 22px 18px; text-align: left; text-transform: none;
    border-bottom: 1px solid var(--border-color);
    border-right: 1px solid var(--border-color);
    vertical-align: middle;
  }
  .table-container thead th:last-child { border-right: none; }
  .table-container thead .highlight-col {
    background: linear-gradient(180deg, var(--primary-color) 0%, var(--primary-dark) 100%);
    color: #fff; position: relative;
  }
  .table-container thead .highlight-col .header-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .table-container thead .highlight-col .header-link {
    color: #fff; text-decoration: underline;
    text-decoration-color: rgba(255, 255, 255, 0.7);
    text-underline-offset: 4px; text-decoration-thickness: 2px;
    transition: text-decoration-color 0.2s ease, opacity 0.2s ease;
  }
  .table-container thead .highlight-col .header-link:hover { text-decoration-color: #fff; opacity: 0.95; }
  .table-container thead .highlight-col .badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.16); color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: .2px; white-space: nowrap;
  }
  .table-container tbody tr { background: #fff; }
  .table-container tbody tr:nth-child(even) { background: var(--row-alt); }
  .table-container tbody td {
    padding: 24px 18px;
    border-bottom: 1px solid var(--border-color);
    border-right: 1px solid var(--border-color);
    vertical-align: top; font-size: 14px; line-height: 1.75; color: #444;
    word-break: normal; overflow-wrap: break-word;
    text-transform: none; background: inherit;
  }
  .table-container tbody tr:last-child td { border-bottom: none; }
  .table-container tbody td:last-child { border-right: none; }
  .table-container tbody td:first-child { width: 18%; font-weight: 700; color: #111827; }
  .table-container tbody .highlight-col {
    background: linear-gradient(180deg, #FAF7FF 0%, #F4EDFF 100%);
    color: #1F1B2D; font-weight: 500;
  }
  .table-container tbody tr:hover .highlight-col { background: linear-gradient(180deg, #FAF7FF 0%, #F4EDFF 100%); }
  .table-container tbody tr:hover { background: #FCFBFF; }
  .table-container th { text-transform: none; white-space: normal; }
  @media screen and (max-width: 992px) {
    .table-container thead th, .table-container tbody td { padding: 16px 12px; font-size: 12px; line-height: 1.6; }
    .table-container thead .highlight-col .header-wrap { gap: 6px; }
    .table-container thead .highlight-col .badge { font-size: 10px; padding: 4px 8px; }
  }
</style>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Feature</th>
        <th class="highlight-col">
          <div class="header-wrap">
            <a href="[FORGE_SIGNUP_URL]" class="header-link" target="_blank" rel="noopener">[Forge Product]</a>
            <span class="badge">Best Overall</span>
          </div>
        </th>
        <th><a href="#tool-2">[Competitor 1]</a></th>
        <th><a href="#tool-3">[Competitor 2]</a></th>
        <th><a href="#tool-4">[Competitor 3]</a></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Pricing</td>
        <td class="highlight-col">[price, unlimited mailboxes included]</td>
        <td>[price]</td>
        <td>[price]</td>
        <td>[price]</td>
      </tr>
      <!-- Canonical rows, then drop or swap per article: Email accounts and mailboxes,
           Data coverage and verification, Deliverability suite, AI sequences and personalization,
           CRM and integrations, Agency and team support, Best for.
           Keep class="highlight-col" on the Forge product cell in every row. -->
    </tbody>
  </table>
</div>
